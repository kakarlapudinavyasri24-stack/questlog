stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - security
  - changelog

default:
  image: node:20
  cache:
    key:
      files:
        - package.json
        - frontend/package-lock.json
    paths:
      - node_modules/
      - frontend/node_modules/
      - backend/node_modules/
  before_script:
    - npm install

lint:
  stage: lint
  script:
    - npm run lint

format:
  stage: format
  script:
    - npm run format:check

type_check:
  stage: type_check
  script:
    - npm run typecheck

test:
  stage: test
  script:
    - npm run test

coverage:
  stage: coverage
  script:
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

npm_audit:
  stage: security
  script:
    - npm run audit

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . --redact --verbose --config .gitleaks.toml

changelog_check:
  stage: changelog
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  before_script: []
  script:
    - git-cliff --config cliff.toml --output CHANGELOG.generated.md
  artifacts:
    when: always
    paths:
      - CHANGELOG.generated.md
